[flake8]
max-line-length = 120
exclude = .git,.venv,venv,build,dist,docs

[pycodestyle]
max-line-length = 120
exclude = .git,.venv,venv,build,dist,docs

[isort]
line_length = 88
known_first_party = classroom_sync
multi_line_output = 3
default_section = THIRDPARTY
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
skip = venv/,.venv/

[mypy]
python_version = 3.12
exclude = test_.*\.py
check_untyped_defs = True
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True

[coverage:run]
omit = tests/*
